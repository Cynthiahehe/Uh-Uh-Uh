<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Click Spam</title>
<style>
:root{--bg:#ff1493;--bg2:#e0087d;--ink:#fff;--ring:#ffd1ec;--shadow:#8a0050;box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 40%,var(--bg) 0,var(--bg2) 100%);color:var(--ink);
font-family:"Bungee","Arial Black",Impact,sans-serif;display:flex;flex-direction:column;align-items:center;
justify-content:center;gap:2vh;overflow:hidden;touch-action:manipulation}
#count{font-size:clamp(3rem,12vw,6rem);line-height:1;text-shadow:0 5px 0 var(--shadow);margin:0}
#hint{font-size:clamp(.8rem,2.4vw,1rem);opacity:.85;margin:0;letter-spacing:.04em}
#pad{width:min(70vmin,520px);aspect-ratio:1;border:0;padding:0;background:none;cursor:pointer;border-radius:50%;
position:relative;outline-offset:8px}
#pad:focus-visible{outline:4px solid #fff}
#pad img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:8px solid var(--ring);
box-shadow:0 12px 0 var(--shadow),0 0 60px rgba(255,255,255,.35);display:block;pointer-events:none;
transform:scale(1);transition:transform .08s ease-out;-webkit-user-drag:none}
#pad.down img{transform:scale(.9) rotate(-3deg);box-shadow:0 4px 0 var(--shadow),0 0 90px rgba(255,255,255,.55)}
.pop{position:fixed;pointer-events:none;font-size:1.6rem;animation:up .7s ease-out forwards;text-shadow:0 3px 0 var(--shadow)}
@keyframes up{to{transform:translateY(-90px) scale(1.4);opacity:0}}
#reset{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));
background:rgba(255,255,255,.18);color:#fff;border:2px solid #fff;border-radius:999px;padding:.4rem .9rem;font:inherit;font-size:.75rem;cursor:pointer}
#reset:hover{background:rgba(255,255,255,.3)}
#caution{position:fixed;inset:0;z-index:10;background:linear-gradient(160deg,#ff1493,#b0005f);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2rem;padding:2rem;text-align:center}
#caution.gone{display:none}
#caution .sign{font-size:clamp(4rem,18vw,7rem);line-height:1;filter:drop-shadow(0 6px 0 var(--shadow))}
#caution p{font-size:clamp(1.3rem,5.5vw,2.4rem);line-height:1.25;margin:0;max-width:18ch;text-shadow:0 4px 0 var(--shadow)}
#go{background:#fff;color:#e0087d;border:0;border-radius:999px;padding:.8rem 2.4rem;font:inherit;font-size:1.2rem;cursor:pointer;box-shadow:0 6px 0 var(--shadow);transition:transform .08s}
#go:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shadow)}
#go:focus-visible{outline:4px solid #fff;outline-offset:4px}
@media (prefers-reduced-motion:reduce){#pad img,.pop{transition:none;animation-duration:.01s}}
</style></head><body>

var ctx=null,buf=null,pool=[],pi=0;
for(var i=0;i<8;i++){pool.push(new Audio(SRC))}
function init(){
 if(ctx)return;
 try{
  var AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();
  var bin=atob(SRC.split(",")[1]),u=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  ctx.decodeAudioData(u.buffer,function(b){buf=b},function(){});
 }catch(e){ctx=null}
}
function sound(){
 if(ctx&&buf){
  if(ctx.state==="suspended")ctx.resume();
  var s=ctx.createBufferSource();s.buffer=buf;s.connect(ctx.destination);s.start(0);
 }else{
  var a=pool[pi++%pool.length];try{a.currentTime=0;a.play()}catch(e){}
 }
}
function bump(x,y){
 n++;c.textContent=n.toLocaleString();
 try{localStorage.setItem(KEY,n)}catch(e){}
 var p=document.createElement("div");p.className="pop";p.textContent="+1";
 p.style.left=(x-12+(Math.random()*40-20))+"px";p.style.top=(y-20)+"px";
 document.body.appendChild(p);setTimeout(function(){p.remove()},700);
}
