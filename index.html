<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Click Spam</title>

  <style>
    /* ---------- Theme ---------- */
    :root {
      --bg: #ff1493;
      --bg-dark: #e0087d;
      --ink: #fff;
      --ring: #ffd1ec;
      --shadow: #8a0050;

      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2vh;
      overflow: hidden;
      touch-action: manipulation;
      color: var(--ink);
      font-family: "Bungee", "Arial Black", Impact, sans-serif;
      background: radial-gradient(circle at 50% 40%, var(--bg) 0, var(--bg-dark) 100%);
    }

    /* ---------- Counter & hint ---------- */
    #count {
      margin: 0;
      font-size: clamp(3rem, 12vw, 6rem);
      line-height: 1;
      text-shadow: 0 5px 0 var(--shadow);
    }

    #hint {
      margin: 0;
      font-size: clamp(0.8rem, 2.4vw, 1rem);
      letter-spacing: 0.04em;
      opacity: 0.85;
    }

    /* ---------- Click pad (the image) ---------- */
    #pad {
      position: relative;
      width: min(70vmin, 520px);
      aspect-ratio: 1;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: none;
      cursor: pointer;
      outline-offset: 8px;
    }

    #pad:focus-visible {
      outline: 4px solid #fff;
    }

    #pad img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: 8px solid var(--ring);
      border-radius: 50%;
      box-shadow: 0 12px 0 var(--shadow), 0 0 60px rgba(255, 255, 255, 0.35);
      pointer-events: none;
      transform: scale(1);
      transition: transform 0.08s ease-out;
      -webkit-user-drag: none;
    }

    #pad.down img {
      transform: scale(0.9) rotate(-3deg);
      box-shadow: 0 4px 0 var(--shadow), 0 0 90px rgba(255, 255, 255, 0.55);
    }

    /* ---------- Floating "+1" ---------- */
    .pop {
      position: fixed;
      font-size: 1.6rem;
      text-shadow: 0 3px 0 var(--shadow);
      pointer-events: none;
      animation: float-up 0.7s ease-out forwards;
    }

    @keyframes float-up {
      to {
        transform: translateY(-90px) scale(1.4);
        opacity: 0;
      }
    }

    /* ---------- Reset button ---------- */
    #reset {
      position: fixed;
      right: max(12px, env(safe-area-inset-right, 0px));
      bottom: max(12px, env(safe-area-inset-bottom, 0px));
      padding: 0.4rem 0.9rem;
      border: 2px solid #fff;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      font: inherit;
      font-size: 0.75rem;
      cursor: pointer;
    }

    #reset:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* ---------- Caution screen ---------- */
    #caution {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.2rem;
      padding: 2rem;
      text-align: center;
      background: linear-gradient(160deg, #ff1493, #b0005f);
    }

    #caution.gone {
      display: none;
    }

    #caution .sign {
      font-size: clamp(4rem, 18vw, 7rem);
      line-height: 1;
      filter: drop-shadow(0 6px 0 var(--shadow));
    }

    #caution p {
      max-width: 18ch;
      margin: 0;
      font-size: clamp(1.3rem, 5.5vw, 2.4rem);
      line-height: 1.25;
      text-shadow: 0 4px 0 var(--shadow);
    }

    #go {
      padding: 0.8rem 2.4rem;
      border: 0;
      border-radius: 999px;
      background: #fff;
      color: #e0087d;
      font: inherit;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 6px 0 var(--shadow);
      transition: transform 0.08s;
    }

    #go:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--shadow);
    }

    #go:focus-visible {
      outline: 4px solid #fff;
      outline-offset: 4px;
    }

    /* ---------- Accessibility ---------- */
    @media (prefers-reduced-motion: reduce) {
      #pad img,
      .pop {
        transition: none;
        animation-duration: 0.01s;
      }
    }
  </style>
</head>

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA";
      const STORAGE_KEY = "clickspam-count";
      const POOL_SIZE = 8;

      // ---------- Elements ----------
      const countEl = document.getElementById("count");
      const pad = document.getElementById("pad");
      const caution = document.getElementById("caution");
      const goBtn = document.getElementById("go");
      const resetBtn = document.getElementById("reset");

      // ---------- State ----------
      let count = 0;
      let started = false;

      try {
        count = parseInt(localStorage.getItem(STORAGE_KEY), 10) || 0;
      } catch (e) {}

      const render = () => {
        countEl.textContent = count.toLocaleString();
      };

      const save = () => {
        try {
          localStorage.setItem(STORAGE_KEY, count);
        } catch (e) {}
      };

      render();

      // ---------- Audio ----------
      // ใช้ Web Audio เป็นหลัก (เล่นซ้อนกันได้ ดีเลย์ต่ำ)
      // ถ้าโหลดไม่ได้ จะ fallback ไปใช้ Audio pool
      let audioCtx = null;
      let audioBuffer = null;
      let poolIndex = 0;
      const pool = Array.from({ length: POOL_SIZE }, () => new Audio(AUDIO_SRC));

      function initAudio() {
        if (audioCtx) return;
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AC();

          // แปลง base64 -> ArrayBuffer แล้ว decode
          const bin = atob(AUDIO_SRC.split(",")[1]);
          const bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

          audioCtx.decodeAudioData(
            bytes.buffer,
            (decoded) => { audioBuffer = decoded; },
            () => {}
          );
        } catch (e) {
          audioCtx = null;
        }
      }

      function playSound() {
        if (audioCtx && audioBuffer) {
          if (audioCtx.state === "suspended") audioCtx.resume();
          const source = audioCtx.createBufferSource();
          source.buffer = audioBuffer;
          source.connect(audioCtx.destination);
          source.start(0);
        } else {
          const audio = pool[poolIndex++ % pool.length];
          try {
            audio.currentTime = 0;
            audio.play();
          } catch (e) {}
        }
      }

      // ---------- Click handling ----------
      function spawnPlusOne(x, y) {
        const el = document.createElement("div");
        el.className = "pop";
        el.textContent = "+1";
        el.style.left = `${x - 12 + (Math.random() * 40 - 20)}px`;
        el.style.top = `${y - 20}px`;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 700);
      }

      function hit(x, y) {
        initAudio();
        playSound();
        count++;
        render();
        save();
        spawnPlusOne(x, y);
      }

      // ---------- Events ----------
      // คลิก / แตะ (รองรับมัลติทัช)
      pad.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        pad.classList.add("down");
        hit(e.clientX, e.clientY);
      });

      ["pointerup", "pointerleave", "pointercancel"].forEach((type) => {
        pad.addEventListener(type, () => pad.classList.remove("down"));
      });

      // คีย์บอร์ด: Space / Enter (ใช้ได้หลังกด Proceed แล้วเท่านั้น)
      const isHitKey = (e) => e.code === "Space" || e.code === "Enter";

      document.addEventListener("keydown", (e) => {
        if (!started || !isHitKey(e)) return;
        e.preventDefault();
        pad.classList.add("down");
        const r = pad.getBoundingClientRect();
        hit(r.left + r.width / 2, r.top + r.height / 3);
      });

      document.addEventListener("keyup", (e) => {
        if (isHitKey(e)) pad.classList.remove("down");
      });

      // ปุ่ม Proceed บนหน้า Caution
      goBtn.addEventListener("click", () => {
        started = true;
        initAudio(); // ปลดล็อกเสียงจากการกดครั้งแรก
        caution.classList.add("gone");
        pad.focus();
      });

      // ปุ่ม Reset
      resetBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        count = 0;
        render();
        save();
      });

      resetBtn.addEventListener("keydown", (e) => e.stopPropagation());
    })();
  </script>
</body>
</html>
